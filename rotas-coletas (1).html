function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.items)?{...x,users:Array.isArray(x.users)?x.users:[],departures:Array.isArray(x.departures)?x.departures:[],settings:{...defaults,...(x.settings||{})}}:{items:demo,users:[],departures:[],settings:{...defaults}}}catch{return{items:demo,users:[],departures:[],settings:{...defaults}}}}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function visibleItems(){return !currentUser||currentUser.role==='admin'?data.items:data.items.filter(x=>x.collectorId===currentUser.id)}function collectorName(id){return data.users.find(u=>u.id===id)?.name||'Não atribuído'}function collectorOptions(selected=''){const users=data.users.filter(u=>u.role==='collector'||u.role==='admin');return users.map(u=>`<option value="${esc(u.id)}" ${selected===u.id?'selected':''}>${esc(u.name)}${u.role==='admin'?' · admin':''}</option>`).join('')}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n)}function tempState(x){if(x===null||x===undefined||x==='')return{label:'Pendente',cls:'gray'};return Number(x)<Number(data.settings.minTemp)||Number(x)>Number(data.settings.maxTemp)?{label:'Verificar faixa',cls:'amber'}:{label:'Registrada',cls:'green'}}function badge(s){let cls=s==='Coletada'?'green':s==='Em rota'?'amber':s==='Cancelada'?'red':'gray';return `<span class="badge ${cls}">${esc(s)}</span>`}function fmtDate(s){if(!s)return'—';return new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}function nameInitial(n){return esc((n||'?').split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase())}function icon(x){return `<span class="ico">${x}</span>`}function setPage(p){if(p==='config'&&currentUser?.role!=='admin'){notify('Apenas administradores podem abrir as configurações.');return}page=p;render();window.scrollTo(0,0)}function notify(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}
function shell(content){const nav=[['inicio','⌂','Visão geral'],['atendimentos','▤','Atendimentos'],['rotas','⌖','Rotas inteligentes'],['temperaturas','♧','Temperaturas'],...(currentUser?.role==='admin'?[['config','⚙','Configurações']]:[])];return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">⌖</div><div><b>RotaLab</b><small>Coletas inteligentes</small></div></div><div class="navlabel">OPERAÇÃO</div><nav class="nav">${nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="setPage('${n[0]}')">${icon(n[1])}${n[2]}</button>`).join('')}</nav><div class="sidebottom"><div class="localpill"><span class="dot"></span>Dados salvos neste dispositivo</div>Versão inicial · uso local</div></aside><main class="main"><header class="topbar"><div class="topleft"><button class="mobilemenu" onclick="setPage('inicio')">⌂</button><span class="eyebrow">${esc(data.settings.lab)}</span><span class="muted">/</span><span class="topdate">${new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'long'})}</span></div><div class="topright"><div class="session-actions">${activeDeparture()?`<span class="shift-state">● Rota iniciada</span><button class="btn small" onclick="finishDeparture()">Finalizar</button>`:`<button class="btn primary small" onclick="startDeparture()">Registrar saída</button>`}<span class="eyebrow">${esc(currentUser?.name||'')}</span><div class="avatar">${nameInitial(currentUser?.name||'')}</div><button class="btn small logout" aria-label="Sair da conta" title="Sair" onclick="logout()">↪</button></div></div></header><div class="workspace">${content}</div></main></div><nav class="mobilebottom">${nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="setPage('${n[0]}')"><span class="ico">${n[1]}</span>${n[2].split(' ')[0]}</button>`).join('')}</nav>`}
function header(title,sub,button=''){return `<div class="pagehead"><div><div class="eyebrow">GESTÃO DE COLETAS</div><h1>${title}</h1><p>${sub}</p></div>${button?`<div class="actions">${button}</div>`:''}</div>`}
function overview(){const todayItems=visibleItems().filter(x=>x.date===today&&x.status!=='Cancelada'),done=todayItems.filter(x=>x.status==='Coletada').length,inRoute=todayItems.filter(x=>x.status==='Em rota').length,pending=todayItems.filter(x=>x.temp==null).length,alerts=todayItems.filter(x=>x.temp!=null&&tempState(x.temp).cls==='amber').length,open=todayItems.filter(x=>x.status!=='Coletada'),sorted=sortRoute(open),scheduleIssues=analyzeSchedule(sorted),lateCount=scheduleIssues.filter(x=>x.delay>0).length,unknownCount=scheduleIssues.filter(x=>x.travel===null).length,routeKm=estimateRoute(sorted),fuelCost=routeKm/(Number(data.settings.efficiency)||1)*(Number(data.settings.fuel)||0),cost=fuelCost+routeKm*(Number(data.settings.maintenance)||0),pct=todayItems.length?Math.round(done/todayItems.length*100):0;const week=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const key=d.toISOString().slice(0,10),items=visibleItems().filter(x=>x.date===key&&x.status!=='Cancelada');return{label:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''),total:items.length,done:items.filter(x=>x.status==='Coletada').length}}),max=Math.max(1,...week.map(x=>x.total));let advice=lateCount?`${lateCount} atendimento(s) podem atrasar com o deslocamento estimado. Revise a sequência ou confirme outro horário com o paciente.`:unknownCount?`${unknownCount} trecho(s) sem distância para estimar o deslocamento. Complete os dados e revise a rota.`:alerts?`Há ${alerts} amostra(s) fora da faixa configurada. Priorize a revisão do protocolo e o registro da tratativa.`:pending?`${pending} amostra(s) ainda sem temperatura de entrada. Planeje o recebimento para registrar a condição assim que chegar ao laboratório.`:open.length>1?`Há ${open.length} paradas pendentes. Organize a sequência e confira o custo estimado antes de liberar a equipe.`:todayItems.length?`Operação em dia: ${done} de ${todayItems.length} coletas concluídas. Mantenha o registro de temperatura na entrada.`:'Cadastre as coletas do dia para obter sugestões de sequência e custo.';const stops=sorted.slice(0,4);return `${header('Visão geral da operação','Planejamento orientado pelos dados das coletas e acompanhamento do dia.',`<span class="livepill"><i></i>Atualizado ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><button class="btn" onclick="exportCSV()">↓ Exportar</button><button class="btn primary" onclick="openModal()">＋ Nova coleta</button>`)}<div class="cards"><div class="card metric"><div class="metric-top">Coletas de hoje<span class="metric-icon">▤</span></div><div class="metric-number">${todayItems.length}</div><div class="metric-foot">${done} concluídas · ${inRoute} em rota · ${open.length} pendentes</div></div><div class="card metric"><div class="metric-top">Conclusão operacional<span class="metric-icon">✓</span></div><div class="metric-number">${pct}<span style="font-size:15px;font-weight:550">%</span></div><div class="metric-foot">${done} de ${todayItems.length} atendimentos do dia</div></div><div class="card metric"><div class="metric-top">Atenção às amostras<span class="metric-icon">♧</span></div><div class="metric-number">${pending+alerts}</div><div class="metric-foot ${alerts||pending?'alert':''}">${alerts} fora da faixa · ${pending} sem registro</div></div><div class="card metric"><div class="metric-top">Custo estimado da rota<span class="metric-icon">◉</span></div><div class="metric-number" style="font-size:25px">${money(cost)}</div><div class="metric-foot">${routeKm.toFixed(1).replace('.',',')} km · combustível e manutenção</div></div></div><div class="dashboard-grid"><section class="panel chart-panel"><div class="panelhead"><div><h2>Ritmo da operação</h2><p>Volume de coletas e conclusões · últimos 7 dias</p></div><span class="badge gray">Atualizado com a agenda</span></div><div class="chart" role="img" aria-label="Coletas totais e concluídas nos últimos sete dias">${week.map(d=>`<div class="chart-col" title="${d.total} coletas, ${d.done} concluídas"><div class="bar-pair"><span class="bar" style="height:${Math.max(d.total?5:2,Math.round(d.total/max*100))}%"></span><span class="bar done" style="height:${Math.max(d.done?5:2,Math.round(d.done/max*100))}%"></span></div><small>${esc(d.label)}</small></div>`).join('')}</div><div class="chart-legend"><span><i></i>Agendadas</span><span><i class="donekey"></i>Concluídas</span></div><div class="dashboard-note">Indicadores calculados a partir dos atendimentos cadastrados neste dispositivo.</div></section><section class="panel"><div class="panelhead"><div><h2>Planejamento rápido</h2><p>Sugestões operacionais baseadas nos dados disponíveis</p></div><span class="assist-tag">Apoio inteligente</span></div><div class="assist"><div class="assist-head"><span class="assist-title">Recomendação para hoje</span><span class="badge ${alerts?'amber':pending?'amber':'green'}">${alerts?'Prioridade':pending?'Atenção':'Análise'}</span></div><p>${esc(advice)}</p><div class="assist-actions"><button class="btn primary small" onclick="setPage('rotas')">Planejar rota →</button>${pending||alerts?`<button class="btn small" onclick="setPage('temperaturas')">Ver amostras</button>`:`<button class="btn small" onclick="optimizeRoute();setPage('rotas')">Otimizar sequência</button>`}</div></div><div class="ops-list"><div class="ops-row"><span class="label"><span class="ops-bullet">⌖</span>Paradas pendentes</span><strong>${open.length}</strong></div><div class="ops-row"><span class="label"><span class="ops-bullet">↗</span>Distância estimada</span><strong>${routeKm.toFixed(1).replace('.',',')} km</strong></div><div class="ops-row"><span class="label"><span class="ops-bullet">◉</span>Combustível estimado</span><strong>${money(fuelCost)}</strong></div></div></section></div><div class="grid2" style="margin-top:16px"><section class="panel"><div class="panelhead"><div><h2>Próximos atendimentos</h2><p>Agenda de hoje · ${todayItems.length} coletas</p></div><button class="textlink" onclick="setPage('atendimentos')">Ver agenda →</button></div>${todayItems.length?`<div class="tablewrap"><table><thead><tr><th>Paciente</th><th>Horário</th><th>Temperatura</th><th>Status</th></tr></thead><tbody>${todayItems.slice().sort((a,b)=>a.time.localeCompare(b.time)).slice(0,5).map(x=>`<tr><td><div class="person"><span class="mini-avatar">${nameInitial(x.name)}</span><span><b>${esc(x.name)}</b><span class="muted" style="display:block;font-size:10px">${esc(x.address)}</span></span></div></td><td>${esc(x.time)}</td><td>${x.temp==null?'<span class="muted">Pendente</span>':`<span class="tempvalue">${Number(x.temp).toFixed(1)}°C</span>`}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Nenhuma coleta para hoje</b>Cadastre um atendimento para começar.</div>`}</section><section class="panel"><div class="panelhead"><div><h2>Rota recomendada</h2><p>Sequência por proximidade das coletas pendentes</p></div><button class="textlink" onclick="setPage('rotas')">Detalhes →</button></div>${stops.length?`<div class="route-list">${stops.map((x,i)=>`<div class="route-stop"><div class="stopnum">${i+1}</div><div class="stopinfo"><b>${esc(x.name)}</b><small>${esc(x.address)}</small></div><div class="stopmeta">${esc(x.time)}<br>${x.distance?Number(x.distance).toFixed(1).replace('.',',')+' km do lab':''}</div></div>`).join('')}</div><div class="route-summary"><span>Percurso aproximado<strong style="display:block">Base → coletas → base</strong></span><b>${routeKm.toFixed(1).replace('.',',')} km</b></div>`:`<div class="empty"><b>Sem paradas pendentes</b>As coletas de hoje já foram atendidas.</div>`}<div class="notice">${lateCount?`Atenção: ${lateCount} possível(is) atraso(s) entre deslocamento e horário agendado.`:unknownCount?`Não foi possível estimar ${unknownCount} trecho(s); confira a rota antes de sair.`:'Horários conferidos com os tempos estimados de deslocamento.'} Estimativa sem trânsito em tempo real; confirme os horários com a equipe.</div></section></div>`}
function appointments(){const todayLate=analyzeSchedule(sortRoute(visibleItems().filter(x=>x.date===today&&x.status!=='Cancelada'&&x.status!=='Coletada'))).filter(x=>x.delay>0);const items=visibleItems().filter(x=>(filter==='Todas'||x.status===filter)&&(!search||`${x.name} ${x.address}`.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `${header('Atendimentos','Cadastre e acompanhe as coletas domiciliares.',`<button class="btn" onclick="exportCSV()">↓ Exportar CSV</button><button class="btn primary" onclick="openModal()">＋ Nova coleta</button>`)}<div class="filters"><input class="field-control" placeholder="⌕ Buscar paciente ou endereço" value="${esc(search)}" oninput="search=this.value;render()"><select class="field-control" onchange="filter=this.value;render()">${['Todas','Agendada','Em rota','Coletada','Cancelada'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn small" onclick="resetDemo()">Restaurar exemplo</button></div>${todayLate.length?`<div class="warningbox route-alert"><b>Possível conflito hoje:</b> ${todayLate.length} coleta(s) podem iniciar depois do horário agendado. Confira a sequência em Rotas inteligentes.</div>`:''}<section class="panel tablepanel"><div class="tablewrap"><table><thead><tr><th>Paciente</th><th>Coletador</th><th>Data e hora</th><th>Endereço</th><th>Dist. lab</th><th>Temperatura</th><th>Status</th><th></th></tr></thead><tbody>${items.length?items.map(x=>`<tr><td><div class="person"><span class="mini-avatar">${nameInitial(x.name)}</span><b>${esc(x.name)}</b></div><span class="muted" style="font-size:10px">${esc(x.phone||'')}</span></td><td>${esc(collectorName(x.collectorId))}</td><td>${fmtDate(x.date)}<br><span class="muted">${esc(x.time)}</span></td><td style="white-space:normal;min-width:175px">${esc(x.address)}</td><td>${x.distance?Number(x.distance).toFixed(1).replace('.',',')+' km':'—'}</td><td>${x.temp==null?'<span class="badge gray">Pendente</span>':`<span class="tempvalue">${Number(x.temp).toFixed(1)}°C</span> <span class="badge ${tempState(x.temp).cls}">${tempState(x.temp).label}</span>`}</td><td>${badge(x.status)}</td><td><button class="btn small" onclick="openModal('${x.id}')">Editar</button></td></tr>`).join(''):`<tr><td colspan="8"><div class="empty"><b>Nenhum atendimento encontrado</b>Altere os filtros ou cadastre uma coleta.</div></td></tr>`}</tbody></table></div></section>`}
function routePage(){const d=window.selectedRouteDate||today;const pool=visibleItems().filter(x=>x.date===d&&x.status!=='Cancelada'&&x.status!=='Coletada');const stops=route.length?route:sortRoute(pool);const plan=analyzeSchedule(stops),late=plan.filter(x=>x.delay>0),unknown=plan.filter(x=>x.travel===null);let km=estimateRoute(stops),cost=km/(Number(data.settings.efficiency)||1)*(Number(data.settings.fuel)||0)+km*(Number(data.settings.maintenance)||0);return `${header('Rotas inteligentes','Confira se o deslocamento cabe entre os horários agendados.',`<button class="btn" onclick="setPage('config')">⚙ Custos e base</button>`)}<div class="route-controls"><div class="field"><label>Data da rota</label><input class="field-control" type="date" value="${d}" onchange="routeDate(this.value)"></div><div class="field"><label>Velocidade média usada</label><input class="field-control" value="${Number(data.settings.avgSpeed)||30} km/h" disabled></div><div class="field"><label>Margem por deslocamento</label><input class="field-control" value="${Number(data.settings.travelBuffer??10)} min" disabled></div><button class="btn primary" onclick="optimizeRoute()">✓ Conferir agenda</button></div>${late.length?`<div class="warningbox route-alert"><b>${late.length} possível(is) conflito(s) de horário.</b> Serviço e deslocamento estimado podem ultrapassar o próximo horário. Revise a sequência ou confirme novo horário com o paciente.</div>`:unknown.length?`<div class="warningbox route-alert"><b>Conferência incompleta.</b> ${unknown.length} trecho(s) sem distância suficiente para estimar o deslocamento; complete os dados e confira a agenda.</div>`:`<div class="successbox">Sem conflito estimado para os horários cadastrados. Confirme a operação antes da saída.</div>`}<div class="route-layout"><section class="panel"><div class="panelhead"><div><h2>Sequência por horário agendado</h2><p>${stops.length} coletas · saída prevista ${esc(data.settings.routeStartTime||'07:00')} · base: ${esc(data.settings.base||'não definida')}</p></div><span class="badge ${late.length?'red':unknown.length?'amber':'green'}">${late.length?`${late.length} conflito(s)`:unknown.length?'Revisão necessária':'Horários conferidos'}</span></div>${stops.length?`<div class="route-list"><div class="route-stop"><div class="stopnum" style="background:#193b30;color:white">⌂</div><div class="stopinfo"><b>Saída do laboratório</b><small>${esc(data.settings.base||'Configure o endereço de partida')}</small></div><div class="stopmeta">${esc(data.settings.routeStartTime||'07:00')}</div></div>${stops.map((x,i)=>{const q=plan.find(y=>y.id===x.id);return `<div class="route-stop"><div class="stopnum">${i+1}</div><div class="stopinfo"><b>${esc(x.name)}</b><small>${esc(x.address)} · agendado ${esc(x.time)}</small><small>${q&&q.arrival!==null?`chegada estimada ${formatMinutes(q.arrival)} · ${q.travel} min de deslocamento`:'Chegada não estimada; informe a distância'}</small><small>${x.temp==null?'Temperatura pendente':`Amostra: ${Number(x.temp).toFixed(1)}°C`}</small></div><div class="stopmeta">${q&&q.delay?`<span class="badge red">Atraso ~${q.delay} min</span>`:badge(x.status)}<br>${x.distance?Number(x.distance).toFixed(1).replace('.',',')+' km do lab':''}</div></div>`}).join('')}<div class="route-stop"><div class="stopnum" style="background:#193b30;color:white">⌂</div><div class="stopinfo"><b>Retorno ao laboratório</b><small>${esc(data.settings.base||'Base')}</small></div><div class="stopmeta">Final</div></div></div><div class="route-summary"><span>Distância estimada<strong style="display:block">Ida, deslocamentos e retorno</strong></span><b>${km.toFixed(1).replace('.',',')} km</b><span>Custo estimado<strong style="display:block">Combustível + manutenção</strong></span><b>${money(cost)}</b></div>`:`<div class="empty"><b>Nenhuma coleta pendente nesta data</b>Cadastre atendimentos para esta data.</div>`}</section><section class="panel"><div class="panelhead"><div><h2>Parâmetros da estimativa</h2><p>Valores ajustáveis em Configurações</p></div></div><div class="ops-list"><div class="ops-row"><span class="label">Saída prevista da base</span><strong>${esc(data.settings.routeStartTime||'07:00')}</strong></div><div class="ops-row"><span class="label">Velocidade média</span><strong>${Number(data.settings.avgSpeed)||30} km/h</strong></div><div class="ops-row"><span class="label">Margem por deslocamento</span><strong>${Number(data.settings.travelBuffer??10)} min</strong></div><div class="ops-row"><span class="label">Conflitos estimados</span><strong class="${late.length?'alert':''}">${late.length}</strong></div></div><div class="notice">A sequência segue a ordem dos horários para reduzir atrasos. Estimativa baseada nas distâncias cadastradas, sem trânsito em tempo real, estacionamento ou espera no local.</div><div style="margin-top:15px"><button class="btn" onclick="exportCSV()">↓ Exportar lista de paradas</button></div></section></div>`}
function routeDate(v){window.selectedRouteDate=v;route=[];render()}function optimizeRoute(){const d=window.selectedRouteDate||today;const pool=visibleItems().filter(x=>x.date===d&&x.status!=='Cancelada'&&x.status!=='Coletada');route=sortRoute(pool);if(!pool.length)notify('Não há paradas pendentes nesta data.');else{const issues=analyzeSchedule(route).filter(x=>x.delay>0);notify(issues.length?`${issues.length} possível(is) conflito(s): revise os horários.`:'Ordem cronológica conferida; nenhum conflito estimado.')}render()}function sortRoute(items){return items.slice().sort((x,y)=>(x.time||'').localeCompare(y.time||''))}function minutesOf(t){if(!t||!/^\d{2}:\d{2}$/.test(t))return null;const [h,m]=t.split(':').map(Number);return h*60+m}function formatMinutes(n){return `${String(Math.floor(n/60)%24).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function estimatedTravelMinutes(from,to){let km=null;if(!from){if(data.settings.lat&&data.settings.lon&&to.lat&&to.lon)km=geo({lat:Number(data.settings.lat),lon:Number(data.settings.lon)},to)*1.25;else if(Number(to.distance)>0)km=Number(to.distance)*1.3}else if(from.lat&&from.lon&&to.lat&&to.lon)km=geo(from,to)*1.25;else if(Number(from.distance)>0&&Number(to.distance)>0)km=Math.max(.5,Math.abs(Number(from.distance)-Number(to.distance)))*1.3;if(km===null||!Number.isFinite(km))return null;const speed=Math.max(5,Number(data.settings.avgSpeed)||30),buffer=Math.max(0,Number(data.settings.travelBuffer??10));return Math.ceil(km/(speed/60))+buffer}function analyzeSchedule(items){let prev=null,departure=minutesOf(data.settings.routeStartTime||'07:00');return sortRoute(items).map(x=>{const scheduled=minutesOf(x.time),travel=estimatedTravelMinutes(prev,x),arrival=travel===null||departure===null?null:departure+travel,delay=arrival!==null&&scheduled!==null?Math.max(0,arrival-scheduled):0,serviceStart=arrival===null||scheduled===null?scheduled:Math.max(arrival,scheduled);departure=serviceStart===null?null:serviceStart+(Number(x.duration)||20);prev=x;return{id:x.id,scheduled,arrival,travel,delay}})}function geo(a,b){let r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lon-a.lon)*r,h=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 6371*2*Math.asin(Math.sqrt(h))}function estimateRoute(a){if(!a.length)return 0;let sum=0;if(data.settings.lat&&data.settings.lon&&a.every(x=>x.lat&&x.lon)){let cur={lat:Number(data.settings.lat),lon:Number(data.settings.lon)};for(const x of a){sum+=geo(cur,x);cur=x}sum+=geo(cur,{lat:Number(data.settings.lat),lon:Number(data.settings.lon)});return sum*1.25}let ds=a.map(x=>Number(x.distance)||0);sum=ds[0];for(let i=1;i<ds.length;i++)sum+=Math.max(1,Math.abs(ds[i]-ds[i-1]));sum+=ds[ds.length-1];return sum*1.3}
function temperatures(){const items=visibleItems().filter(x=>x.date===today&&x.status!=='Cancelada').sort((a,b)=>(a.time||'').localeCompare(b.time||'')),ok=items.filter(x=>x.temp!=null&&tempState(x.temp).cls==='green').length,alert=items.filter(x=>x.temp!=null&&tempState(x.temp).cls==='amber').length,pend=items.filter(x=>x.temp==null).length;return `${header('Temperaturas','Registro de entrada e acompanhamento das amostras.',`<button class="btn" onclick="setPage('config')">⚙ Faixa operacional</button>`)}<div class="warningbox">A faixa de referência é definida pelo laboratório. Confirme os limites aplicáveis aos exames e procedimentos da sua operação; o alerta abaixo usa apenas os valores configurados.</div><div class="cards"><div class="card metric"><div class="metric-top">Registros dentro da faixa<span class="metric-icon">✓</span></div><div class="metric-number">${ok}</div><div class="metric-foot">De ${items.filter(x=>x.temp!=null).length} amostras registradas hoje</div></div><div class="card metric"><div class="metric-top">Revisar faixa<span class="metric-icon">!</span></div><div class="metric-number">${alert}</div><div class="metric-foot ${alert?'alert':''}">Conferir protocolo interno</div></div><div class="card metric"><div class="metric-top">Aguardando registro<span class="metric-icon">◷</span></div><div class="metric-number">${pend}</div><div class="metric-foot">Registre na entrada no laboratório</div></div><div class="card metric"><div class="metric-top">Faixa configurada<span class="metric-icon">↔</span></div><div class="metric-number" style="font-size:24px">${data.settings.minTemp}–${data.settings.maxTemp}°</div><div class="metric-foot">Alterável nas configurações</div></div></div><section class="panel"><div class="panelhead"><div><h2>Entrada de amostras · hoje</h2><p>Temperatura informada no recebimento no laboratório</p></div><button class="textlink" onclick="setPage('atendimentos')">Abrir atendimentos →</button></div><div class="temp-grid">${items.length?items.map(x=>{let st=tempState(x.temp);return `<div class="temp-card"><div style="display:flex;justify-content:space-between;gap:8px"> <div><h3>${esc(x.name)}</h3><small>${esc(x.time)} · ${esc(x.address.split('·').pop().trim())}</small></div><button class="btn small" onclick="openModal('${x.id}')">${x.temp==null?'Registrar':'Editar'}</button></div><div class="temperature">${x.temp==null?'—':Number(x.temp).toFixed(1)+'°C'}</div><span class="badge ${st.cls}">${st.label}</span></div>`}).join(''):`<div class="empty"><b>Nenhuma coleta para hoje</b></div>`}</div></section>`}
function settings(){return `${header('Configurações','Ajuste os parâmetros de custo e controle do laboratório.')}<div class="settings-grid"><section class="panel settings-card"><h2>Laboratório e operação</h2><p>Defina a base de saída e os custos usados nas estimativas de rota.</p><form id="settingsForm"><div class="formgrid"><div class="field span2"><label>Nome do laboratório</label><input id="sLab" value="${esc(data.settings.lab)}"></div><div class="field span2"><label>Endereço da base</label><input id="sBase" value="${esc(data.settings.base)}"></div><div class="field"><label>Preço do combustível (R$/L)</label><input type="number" step="0.01" min="0" id="sFuel" value="${data.settings.fuel}"></div><div class="field"><label>Consumo médio (km/L)</label><input type="number" step="0.1" min="0.1" id="sEff" value="${data.settings.efficiency}"></div><div class="field"><label>Manutenção/desgaste (R$/km)</label><input type="number" step="0.01" min="0" id="sMaint" value="${data.settings.maintenance}"></div><div class="field"><label>Saída padrão da base</label><input type="time" id="sRouteStart" value="${esc(data.settings.routeStartTime||'07:00')}"></div><div class="field"><label>Velocidade média estimada (km/h)</label><input type="number" step="1" min="5" id="sAvgSpeed" value="${Number(data.settings.avgSpeed)||30}"></div><div class="field"><label>Margem por deslocamento (min)</label><input type="number" step="1" min="0" id="sTravelBuffer" value="${Number(data.settings.travelBuffer??10)}"></div><div class="field"><label>Latitude da base (opcional)</label><input id="sLat" type="number" step="any" value="${esc(data.settings.lat)}" placeholder="Ex.: -29.68"></div><div class="field"><label>Longitude da base (opcional)</label><input id="sLon" type="number" step="any" value="${esc(data.settings.lon)}" placeholder="Ex.: -53.80"></div></div><div class="savebar"><button class="btn primary">Salvar parâmetros</button></div></form></section><section class="panel settings-card"><h2>Acesso da equipe</h2><p>Cadastre coletores e mantenha os atendimentos separados por conta neste dispositivo.</p><form id="userForm"><div class="formgrid"><div class="field"><label>Nome do coletador *</label><input id="uName" required placeholder="Nome para identificação"></div><div class="field"><label>PIN local (mínimo 4 dígitos) *</label><input id="uPin" required inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" placeholder="••••"></div></div><div class="savebar"><button class="btn primary">Adicionar coletador</button></div></form><div class="userlist">${data.users.map(u=>`<div class="userrow"><span><b>${esc(u.name)}</b><small>${u.role==='admin'?'Administrador':'Coletador'}</small></span>${u.id===currentUser.id?'<span class="badge green">Sua conta</span>':`<button class="btn small danger" onclick="removeUser('${esc(u.id)}')">Remover</button>`}</div>`).join('')}</div><div class="notice">O PIN é uma trava básica local, não substitui autenticação segura. Contas e registros ficam somente neste navegador/dispositivo.</div></section><section class="panel settings-card"><h2>Registro de saídas</h2><p>Histórico de início e fim de rota, vinculado ao coletador.</p>${data.departures.length?`<div class="tablewrap"><table><thead><tr><th>Coletador</th><th>Data</th><th>Saída</th><th>Retorno</th><th>Atendimentos</th></tr></thead><tbody>${data.departures.slice().reverse().slice(0,20).map(d=>`<tr><td>${esc(d.collectorName)}</td><td>${fmtDate(d.date)}</td><td>${new Date(d.startedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td>${d.endedAt?new Date(d.endedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'<span class="badge amber">Em rota</span>'}</td><td>${d.collectionCount||0}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ainda não há saídas registradas.</div>'}</section><section class="panel settings-card"><h2>Faixa de temperatura</h2><p>Parâmetros operacionais definidos pelo responsável técnico do laboratório.</p><div class="formgrid"><div class="field"><label>Mínima (°C)</label><input type="number" id="sMin" step="0.1" value="${data.settings.minTemp}"></div><div class="field"><label>Máxima (°C)</label><input type="number" id="sMax" step="0.1" value="${data.settings.maxTemp}"></div></div><div class="savebar"><button class="btn primary" onclick="saveTemps()">Salvar faixa</button></div><div class="notice">O sistema sinaliza valores fora desta faixa para revisão. A configuração não substitui os procedimentos técnicos, requisitos de conservação ou validação específicos de cada tipo de amostra.</div></section><section class="panel settings-card"><h2>Dados e privacidade</h2><p>Informações guardadas localmente neste navegador e dispositivo. Não há sincronização entre usuários.</p><div class="actions"><button class="btn" onclick="exportBackup()">↓ Baixar cópia de segurança</button><label class="btn" for="importFile">↑ Restaurar cópia</label><input id="importFile" type="file" accept="application/json" hidden onchange="importBackup(this)"></div><div class="notice">Em dispositivo compartilhado, encerre a sessão do navegador e proteja o acesso físico. A cópia de segurança contém dados pessoais dos pacientes.</div></section><section class="panel settings-card"><h2>Limitações desta versão</h2><p>Este MVP funciona offline no mesmo navegador.</p><ul class="helper" style="padding-left:18px;line-height:1.8"><li>Roteirização e horários são estimativas; não consideram trânsito em tempo real, estacionamento ou espera no local.</li><li>Geocodificação e distância rodoviária dependem de serviços externos, internet e autorização explícita; revise o endereço reconhecido e o percurso.</li><li>A rota segue a ordem dos horários e sinaliza possíveis atrasos com base nas distâncias cadastradas.</li><li>Sem trânsito em tempo real ou sincronização em nuvem; as contas de equipe são locais a este dispositivo.</li><li>Exportação CSV e cópia JSON para apoiar o fluxo operacional.</li></ul></section></div>`}
function render(){currentUser=null;try{const u=JSON.parse(sessionStorage.getItem('rotalab_user')||'null');currentUser=data.users.find(x=>x.id===u?.id)||null}catch{}if(!data.users.length){document.getElementById('app').innerHTML=setupView();bindAuth();return}if(!currentUser){document.getElementById('app').innerHTML=loginView();bindAuth();return}let c=page==='inicio'?overview():page==='atendimentos'?appointments():page==='rotas'?routePage():page==='temperaturas'?temperatures():settings();document.getElementById('app').innerHTML=shell(c);bindForms()}
function setupView(){return `<main class="authscreen"><section class="authcard"><div class="authbrand"><div class="brandmark">⌖</div><div><b>RotaLab</b><small class="muted" style="display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase">Coletas inteligentes</small></div></div><h1>Configure o acesso inicial</h1><p>Crie a conta administradora para proteger este dispositivo e cadastrar a equipe.</p><form id="setupForm"><div class="field"><label>Nome do administrador</label><input id="setupName" required placeholder="Ex.: Responsável do laboratório"></div><div class="field"><label>PIN local de 4 a 8 dígitos</label><input id="setupPin" required inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" placeholder="••••"></div><button class="btn primary">Criar acesso administrador</button></form><div class="authnote">O acesso e os dados ficam neste navegador. Para uso seguro entre celulares e vários coletores, é necessária uma versão com servidor e sincronização.</div></section></main>`}function loginView(){return `<main class="authscreen"><section class="authcard"><div class="authbrand"><div class="brandmark">⌖</div><div><b>RotaLab</b><small class="muted" style="display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase">Coletas inteligentes</small></div></div><h1>Entrar na operação</h1><p>Identifique-se antes de iniciar sua rota.</p><form id="loginForm"><div class="field"><label>Conta</label><select id="loginUser" required>${data.users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)} · ${u.role==='admin'?'admin':'coletador'}</option>`).join('')}</select></div><div class="field"><label>PIN</label><input id="loginPin" type="password" required inputmode="numeric" autocomplete="current-password" placeholder="Seu PIN"></div><button class="btn primary">Entrar</button></form><div class="authnote">Bloqueio local básico neste dispositivo; não é autenticação de servidor.</div></section></main>`}async function pinHash(pin,salt){const value=salt+':'+pin;if(globalThis.crypto?.subtle){const bytes=new TextEncoder().encode(value),digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(let i=0;i<value.length;i++)h=Math.imul(h^value.charCodeAt(i),16777619);return (h>>>0).toString(16)}function signIn(user){currentUser=user;sessionStorage.setItem('rotalab_user',JSON.stringify({id:user.id}));page='inicio';render()}function bindAuth(){const setup=document.getElementById('setupForm');if(setup)setup.onsubmit=async e=>{e.preventDefault();const name=document.getElementById('setupName').value.trim(),pin=document.getElementById('setupPin').value;if(!/^[0-9]{4,8}$/.test(pin)){notify('Use um PIN de 4 a 8 dígitos.');return}const salt=crypto.randomUUID(),user={id:crypto.randomUUID(),name,role:'admin',pinSalt:salt,pinHash:await pinHash(pin,salt)};data.users.push(user);persist();signIn(user)};const login=document.getElementById('loginForm');if(login)login.onsubmit=async e=>{e.preventDefault();const user=data.users.find(u=>u.id===document.getElementById('loginUser').value),pin=document.getElementById('loginPin').value;if(user&&await pinHash(pin,user.pinSalt)===user.pinHash)signIn(user);else notify('Conta ou PIN incorreto.')}}function logout(){sessionStorage.removeItem('rotalab_user');currentUser=null;page='inicio';render()}function activeDeparture(){return currentUser&&data.departures.find(d=>d.collectorId===currentUser.id&&d.date===today&&!d.endedAt)}function startDeparture(){if(activeDeparture()){notify('Sua rota de hoje já foi iniciada.');return}const assigned=visibleItems().filter(x=>x.date===today&&x.status!=='Cancelada'&&x.status!=='Coletada');data.departures.push({id:crypto.randomUUID(),collectorId:currentUser.id,collectorName:currentUser.name,date:today,startedAt:new Date().toISOString(),endedAt:null,collectionCount:assigned.length,collectionIds:assigned.map(x=>x.id)});persist();render();notify('Saída registrada para '+currentUser.name+'.')}function finishDeparture(){const d=activeDeparture();if(!d)return;d.endedAt=new Date().toISOString();persist();render();notify('Fim da rota registrado.')}async function addCollector(e){e.preventDefault();const name=document.getElementById('uName').value.trim(),pin=document.getElementById('uPin').value;if(!/^[0-9]{4,8}$/.test(pin)){notify('Use um PIN numérico de 4 a 8 dígitos.');return}if(data.users.some(u=>u.name.toLowerCase()===name.toLowerCase())){notify('Já existe uma conta com esse nome.');return}const salt=crypto.randomUUID();data.users.push({id:crypto.randomUUID(),name,role:'collector',pinSalt:salt,pinHash:await pinHash(pin,salt)});persist();render();notify('Coletador cadastrado.')}function removeUser(id){if(currentUser?.role!=='admin')return;const u=data.users.find(x=>x.id===id);if(!u||u.role==='admin'){notify('A conta administradora não pode ser removida.');return}if(!confirm(`Remover a conta de ${u.name}? Os atendimentos e saídas já registrados serão preservados.`))return;data.users=data.users.filter(x=>x.id!==id);persist();render();notify('Conta removida; histórico preservado.')}
let distanceTimer;let distanceController;let distanceRequest=0;function bindForms(){const f=document.getElementById('collectionForm');if(f){f.onsubmit=saveCollection;const address=document.getElementById('fAddress'),consent=document.getElementById('fGeoConsent');address.addEventListener('input',()=>{distanceRequest++;document.getElementById('fLat').value='';document.getElementById('fLon').value='';document.getElementById('fDistance').value='';clearTimeout(distanceTimer);if(distanceController)distanceController.abort();setDistanceStatus('');if(consent.checked&&address.value.trim())distanceTimer=setTimeout(calculateAddressDistance,1100)});consent.addEventListener('change',()=>{clearTimeout(distanceTimer);if(consent.checked&&address.value.trim())calculateAddressDistance();else setDistanceStatus('Cálculo automático desativado. Você pode informar a distância manualmente.')})}const s=document.getElementById('settingsForm');if(s)s.onsubmit=saveSettings;const u=document.getElementById('userForm');if(u)u.onsubmit=addCollector}function setDistanceStatus(message,kind=''){const el=document.getElementById('distanceStatus');if(el){el.textContent=message;el.className='distance-status'+(kind?' '+kind:'')}}function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}async function geocodeAddress(address,signal){const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&q='+encodeURIComponent(address);const response=await fetch(url,{signal,headers:{Accept:'application/json'}});if(!response.ok)throw Error(response.status===429?'Serviço de mapas temporariamente limitado.':'Não foi possível localizar este endereço.');const result=await response.json();if(!result.length)throw Error('Endereço não localizado. Informe rua, número, cidade e UF.');return{lat:Number(result[0].lat),lon:Number(result[0].lon),label:result[0].display_name}}async function calculateAddressDistance(){const address=document.getElementById('fAddress').value.trim(),base=(data.settings.base||'').trim(),consent=document.getElementById('fGeoConsent').checked;if(!consent)return;if(!address)return setDistanceStatus('Informe o endereço da coleta.');if(!base||base==='Endereço do laboratório')return setDistanceStatus('Configure o endereço real do laboratório em Configurações.', 'error');if(distanceController)distanceController.abort();const controller=new AbortController(),request=++distanceRequest;distanceController=controller;const timer=setTimeout(()=>controller.abort(),20000);setDistanceStatus('Localizando endereços e calculando trajeto rodoviário…');try{const home=await geocodeAddress(address,controller.signal);await wait(1100);const lab=await geocodeAddress(base,controller.signal);const url=`https://router.project-osrm.org/route/v1/driving/${lab.lon},${lab.lat};${home.lon},${home.lat}?overview=false`;const response=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json'}});if(!response.ok)throw Error('Serviço de rotas indisponível. Tente novamente ou informe a distância manualmente.');const routeData=await response.json();if(routeData.code!=='Ok'||!routeData.routes?.length)throw Error('Não foi possível calcular o trajeto por estrada entre os endereços.');if(request!==distanceRequest)return;const km=routeData.routes[0].distance/1000;document.getElementById('fDistance').value=km.toFixed(1);document.getElementById('fLat').value=home.lat;document.getElementById('fLon').value=home.lon;setDistanceStatus(`Distância estimada: ${km.toFixed(1).replace('.',',')} km. Endereço localizado: ${home.label}. Confira antes de salvar.`, 'ok')}catch(error){if(request!==distanceRequest)return;setDistanceStatus(error.name==='AbortError'?'Cálculo cancelado ou demorou demais. Tente novamente.':error.message||'Falha ao calcular. Informe a distância manualmente.', 'error')}finally{clearTimeout(timer)}}

if(a>=b){notify('A temperatura mínima deve ser menor que a máxima.');return}data.settings.minTemp=a;data.settings.maxTemp=b;persist();render();notify('Faixa de temperatura atualizada.')}function resetDemo(){if(currentUser?.role!=='admin'){notify('Apenas administrador pode restaurar os exemplos.');return}if(confirm('Substituir os dados atuais pelos exemplos? Exporte uma cópia antes, se necessário.')){data={...data,items:demo.map(x=>({...x})),settings:{...defaults}};persist();render();notify('Exemplos restaurados.')}}function exportCSV(){const rows=[['Paciente','Coletador','Telefone','Data','Hora','Endereço','Distância do laboratório (km)','Tempo (min)','Temperatura (°C)','Status'],...visibleItems().map(x=>[x.name,collectorName(x.collectorId),x.phone,x.date,x.time,x.address,x.distance,x.duration,x.temp??'',x.status])];const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'rotalab-atendimentos.csv');notify('Planilha CSV exportada.')}function exportBackup(){if(currentUser?.role!=='admin'){notify('Apenas administrador pode gerar a cópia completa.');return}download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'rotalab-copia-seguranca.json');notify('Cópia de segurança exportada.')}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importBackup(input){if(currentUser?.role!=='admin'){notify('Apenas administrador pode restaurar uma cópia.');return}const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.items)||!d.settings)throw Error();if(confirm('Substituir os dados deste dispositivo pela cópia selecionada?')){data=d;persist();render();notify('Cópia restaurada.')}}catch{notify('Arquivo de cópia inválido.')}};reader.readAsText(file)}
